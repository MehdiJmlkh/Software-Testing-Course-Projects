name: Build and Run Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'oracle'
        cache: 'maven'

    - name: Run Mizdooni tests
      run: cd Mizdooni && mvn test -B 

    - name: Run Fesadyab tests
      run: cd Fesadyab && mvn test -B 